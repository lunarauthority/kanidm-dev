name: build-kanidmd

# Builds and pushes kanidmd (server/Dockerfile, unmodified from upstream) to
# our own registry. Runs on the `populus` branch only — that's where our
# actual patches live; `main`/`upstream-main` are documentation/reference
# branches, not build inputs. See README.md's "Populus Modifications"
# section for what's patched and why.

on:
  push:
    branches: [populus]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      sha8: ${{ steps.sha8.outputs.sha8 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set SHA8
        id: sha8
        run: echo "sha8=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Zot
        uses: docker/login-action@v4
        with:
          registry: registry2.initiativeeconomics.dev:5443
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Build and push kanidmd
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: registry2.initiativeeconomics.dev:5443/populus/kanidm-dev/server:${{ steps.sha8.outputs.sha8 }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
